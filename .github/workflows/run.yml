name: Binance Square Signal Bot

on:
  workflow_dispatch:


concurrency:
  group: binance-square-signal-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Binance Square skill
        run: |
          npx skills add https://github.com/binance/binance-skills-hub --skill square-post -y
          mkdir -p ~/.config/binance-square
          echo -n "${{ secrets.SQUARE_API }}" > ~/.config/binance-square/openapi-key

      - name: Restore published history
        uses: actions/cache@v4
        with:
          path: published_history.json
          key: published-history-${{ github.run_id }}
          restore-keys: |
            published-history-

      - name: Restore post memory
        uses: actions/cache@v4
        with:
          path: post_memory.json
          key: post-memory-${{ github.run_id }}
          restore-keys: |
            post-memory-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run offline safety tests
        run: python self_test.py
        env:
          CONTENT_MODE: deterministic
          POST_MAX_CHARS: 900

      - name: Scan, generate and publish
        run: python main.py
        env:
          MISTRAL_API: ${{ secrets.MISTRAL_API }}
          MISTRAL_MODEL: mistral-small-latest
          CONTENT_MODE: ai_first
          AI_VARIANTS: 4
          AI_TEMPERATURE: 0.55
          AI_MIN_VALID: 2

          SQUARE_API: ${{ secrets.SQUARE_API }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.SQUARE_API }}

          LOG_LEVEL: INFO
          COOLDOWN_MIN: 180
          TOP_SYMBOLS: 80
          SHORTLIST_SIZE: 18
          FINAL_CANDIDATES: 10
          MIN_ADX: 17.5
          MIN_RR: 1.25
          MIN_MTF_ALIGN: 0.34
          MIN_VOLUME_REL: 0.55
          MAX_FUNDING_ABS: 0.001
          STRICT_BTC_FILTER: 1
          ENABLE_BALANCED_FALLBACK: 1

          POST_VARIANTS: 8
          POST_MIN_CHARS: 260
          POST_MAX_CHARS: 900
          MIN_POST_QUALITY: 78
          MAX_POST_SIMILARITY: 0.45

          PUBLISH_IMAGES: 1
          PUBLISH_MEDIA_MODE: chart
          DRY_RUN: 0
