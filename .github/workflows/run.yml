name: Binance Square Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:

  run-bot:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    env:
      MISTRAL_API: ${{ secrets.MISTRAL_API }}
      SQUARE_API: ${{ secrets.SQUARE_API }}
      BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}

      REFERRAL_LINK: ${{ secrets.REFERRAL_LINK }}

      LOG_LEVEL: INFO

      # Signal settings
      COOLDOWN_MIN: 180
      TOP_SYMBOLS: 80
      MAX_FUNDING_ABS: 0.001

      # AI Writer
      ENABLE_AI_POLISH: "true"
      USE_MISTRAL: "true"
      MISTRAL_MODEL: "mistral-small-latest"

      # Human post generation
      AI_VARIANTS: 3
      AI_HUMAN_MODE: "true"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Check environment
        run: |
          python - <<'PY'
          import os

          print("MISTRAL_API:",
                "OK" if os.getenv("MISTRAL_API") else "MISSING")

          print("ENABLE_AI_POLISH:",
                os.getenv("ENABLE_AI_POLISH"))

          print("USE_MISTRAL:",
                os.getenv("USE_MISTRAL"))
          PY


      - name: Run bot
        run: |
          python main.py
